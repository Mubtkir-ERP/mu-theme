<!-- Close Mobile Menu Button -->
<div class="close-mobile-menu fixed ms-[275px] w-10 h-10 items-center justify-center sm:hidden z-50 [&.close-mobile-menu--mobile-menu-open]:flex">
    <a class="mt-5 ms-5" href="">
        <i data-lucide="x" class="stroke-[1] w-8 h-8 text-white"></i>
    </a>
</div>

<!-- Side Menu -->
<div class="side-menu__content h-full box border-transparent rounded-none xl:rounded-xl
            bg-gradient-to-b from-theme-1 to-theme-2 z-20 relative w-[275px]
            duration-300 transition-[width]
            group-[.side-menu--collapsed]:xl:w-[91px]
            group-[.side-menu--collapsed.side-menu--on-hover]:xl:w-[275px]
            overflow-hidden flex flex-col
            after:content-[``] after:absolute after:inset-0 after:-me-4
            after:bg-texture-white after:bg-contain after:bg-fixed
            after:bg-[center_-20rem] after:bg-no-repeat">

    <!-- =========================
         Sidebar Header (FIXED)
    ========================== -->
    <div class="flex items-center z-10 px-2 h-[65px] overflow-hidden relative"
         dir="ltr">

        <!-- Back / Compact Toggle -->
        <a
            href=""
            class="toggle-compact-menu flex items-center justify-center
                   w-10 h-10 rounded-full border border-white/40
                   text-white hover:bg-white/10 transition
                   group-[.side-menu--collapsed]:xl:rotate-180
                   group-[.side-menu--collapsed.side-menu--on-hover]:xl:opacity-100
                   group-[.side-menu--collapsed]:xl:opacity-0
                   xl:flex tw-hidden"
        >
            <i data-lucide="arrow-left" class="h-3.5 w-3.5 stroke-[1.3]"></i>
        </a>

        <!-- Company Name (CENTER) -->
        <div class="flex-1 text-center overflow-hidden">
            <span
                class="block font-medium text-white truncate
                       transition-opacity
                       group-[.side-menu--collapsed.side-menu--on-hover]:xl:opacity-100
                       group-[.side-menu--collapsed]:xl:opacity-0"
                dir="rtl"
            >
                {{ theme_settings.sidebar_text
                    or frappe.db.get_default("Company")
                    or "MUBTKIR"
                }}
            </span>
        </div>

        <!-- Logo (RIGHT – ثابت دائمًا) -->
        <div class="flex items-center justify-center w-10 h-10">
            <img
                src="{{ theme_settings.sidebar_logo or '/assets/nxt_theme/images/small_icon.ico' }}"
                alt="logo"
                class="w-8 h-8 object-contain"
            />
        </div>

    </div>

    <!-- =========================
         Sidebar Menu Content
    ========================== -->
    <div class="scrollable-ref w-full h-full z-20 px-5 overflow-y-auto overflow-x-hidden pb-3
                [-webkit-mask-image:-webkit-linear-gradient(top,rgba(0,0,0,0),black_30px)]
                [&:-webkit-scrollbar]:w-0
                [&:-webkit-scrollbar]:bg-transparent
                [&_.simplebar-content]:p-0
                [&_.simplebar-track.simplebar-vertical]:w-[10px]
                [&_.simplebar-track.simplebar-vertical]:me-0.5
                [&_.simplebar-track.simplebar-vertical_.simplebar-scrollbar]:before:bg-slate-400/30">
        {% include "templates/includes/sidebar_menu.html" %}
    </div>

</div>
