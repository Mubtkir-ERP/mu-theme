<!-- Sidebar / Header -->
<div class="flex items-center w-full h-[65px] px-3 select-none"
     dir="ltr">

    <!-- Back / Toggle Arrow -->
    <a
        href=""
        class="flex items-center justify-center w-10 h-10 rounded-full border border-white/40 text-white hover:bg-white/10 transition"
    >
        <i data-lucide="arrow-left" class="w-4 h-4 stroke-[1.5]"></i>
    </a>

    <!-- Company Name -->
    <div class="flex-1 text-center overflow-hidden">
        <span
            class="block text-white font-medium truncate"
            dir="rtl"
        >
            {{ theme_settings.sidebar_text
                or frappe.db.get_default("Company")
                or "MUBTKIR"
            }}
        </span>
    </div>

    <!-- Logo -->
    <div class="flex items-center justify-center w-10 h-10">
        <img
            src="{{ theme_settings.sidebar_logo or '/assets/nxt_theme/images/small_icon.ico' }}"
            alt="logo"
            class="w-8 h-8 object-contain"
        />
    </div>

</div>
