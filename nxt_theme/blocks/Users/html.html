<!--
  ══════════════════════════════════════════
  لوحة تحكم قسم المشتريات — ERPNext Workspace
  MUBTKIR ERP
  ══════════════════════════════════════════

  الهيكل:
    ١. خلفية الشعار
    ٢. دورة المشتريات
    ٣. نظرة عامة - 4 بطاقات
    ٤. أزرار الاختصارات
    ٥. التقارير والبيانات الرئيسية
    ٦. الفوتر
-->

<div class="erp-dashboard-wrapper" data-erp-dashboard>

  <!-- ═══ ١. خلفية الشعار ═══ -->
 <img
  src="/assets/nxt_theme/images/background-erp.png"
  class="erp-dashboard-bg"
  alt=""
>


  <!-- ═══ ٢. دورة المشتريات ═══ -->
  <div
    class="erp-purchase-cycle-section"
    data-purchase-cycle
  ></div>


  <!-- ═══ ٣. نظرة عامة ═══ -->
  <div
    class="erp-stats-section"
    data-stats-section
  ></div>


  <!-- ═══ ٤. أزرار الاختصارات السريعة ═══ -->
  <div
    class="erp-quick-actions"
    data-quick-actions
  ></div>


  <!-- ═══ ٥. بطاقات التقارير والماسترز ═══ -->
  <div
    class="erp-dashboard-content"
    data-dashboard-content
  ></div>


  <!-- ═══ ٦. الفوتر ═══ -->
  <div
    class="erp-footer"
    data-dashboard-footer
  ></div>

</div>
