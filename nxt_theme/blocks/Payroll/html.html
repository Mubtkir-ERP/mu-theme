<!--
  ══════════════════════════════════════════
  لوحة تحكم قسم المبيعات — ERPNext Workspace
  ══════════════════════════════════════════

  الهيكل:
    ١. خلفية الشعار
    ٢. الشعار الرئيسي
    ٣. بطاقات الإحصائيات  (يملأها JS)
    ٤. أزرار الاختصارات    (يملأها JS)
    ٥. بطاقات التقارير     (يملأها JS)
    ٦. الفوتر             (يملأها JS)
-->

<div class="erp-dashboard-wrapper" data-erp-dashboard>

  <!-- ═══ ١. خلفية الشعار ═══ -->
<img
  src="/assets/nxt_theme/images/background-erp.png"
  class="erp-dashboard-bg"
  alt=""
>



  <!-- ═══ ٣. بطاقات الإحصائيات (تحت الشعار) ═══ -->
  <div
    class="erp-stats-section"
    data-stats-section
  ></div>

  <!-- ═══ ٤. أزرار الاختصارات السريعة ═══ -->
  <div
    class="erp-quick-actions"
    data-quick-actions
  ></div>

  <!-- ═══ ٥. بطاقات التقارير والماسترز ═══ -->
  <div
    class="erp-dashboard-content"
    data-dashboard-content
  ></div>

  <!-- ═══ ٦. الفوتر (بيانات التواصل) ═══ -->
  <div
    class="erp-footer"
    data-dashboard-footer
  ></div>

</div>
