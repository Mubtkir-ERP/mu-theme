  ══════════════════════════════════════════
  لوحة تحكم نقاط البيع POSNext — Mubtkir ERP
  ══════════════════════════════════════════

  الهيكل:
    ١. خلفية الشعار
    ٢. دورة نقطة البيع
    ٣. نظرة عامة - 4 بطاقات إحصائية
    ٤. اختصاراتك السريعة (حسب ترتيب الورك سبيس)

<div class="erp-dashboard-wrapper" data-erp-dashboard>

    src="/assets/nxt_theme/images/background-erp.png"
    class="erp-dashboard-bg"
    alt=""
  >

  <!-- ═══ ٢. دورة نقطة البيع ═══ -->
  <div
    class="erp-purchase-cycle-section"
    data-purchase-cycle

  <!-- ═══ ٣. نظرة عامة ═══ -->
  <div
    class="erp-stats-section"
    data-stats-section
  ></div>

  <!-- ═══ ٤. أزرار الاختصارات السريعة ═══ -->
  <div
    class="erp-quick-actions"
    data-quick-actions
  ></div>

  <!-- ═══ ٥. بطاقات التقارير والإعدادات ═══ -->
  <div
    class="erp-dashboard-content"
    data-dashboard-content
  ></div>

  <div
    class="erp-footer"
    data-dashboard-footer
